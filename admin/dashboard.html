<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Painel Administrativo | Projetos</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body class="admin-body">
    <header class="admin-header">
      <h1>Gerenciar Projetos</h1>
      <button id="logout-btn" class="btn-logout">Sair</button>
    </header>

    <main class="admin-main">
      <!-- =================================================
           FORMULÁRIO (adicionar / editar)
      ================================================== -->

      <section class="admin-form-card">
        <h2 id="form-title">Novo projeto</h2>

        <form id="project-form">
          <input type="hidden" id="project-id" value="" />

          <label for="title">Título do projeto</label>
          <input type="text" id="title" required placeholder="Ex: Instalação em galpão industrial" />

          <label for="category">Categoria</label>
          <input type="text" id="category"  placeholder="Ex: Instalação, Manutenção, Segurança" />

          <label for="description">Descrição</label>
          <textarea id="description" rows="4"  placeholder="Descreva o projeto realizado..."></textarea>

          <label for="image">Imagem do projeto</label>
          <input type="file" id="image" accept="image/*" />
          <p class="image-hint" id="image-hint">Envie uma imagem (JPG ou PNG).</p>

          <div class="form-actions">
            <button type="submit" id="submit-btn">Adicionar projeto</button>
            <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display: none">
              Cancelar edição
            </button>
          </div>

          <p id="form-error" class="login-error"></p>
        </form>
      </section>

      <!-- =================================================
           LISTA DE PROJETOS CADASTRADOS
      ================================================== -->

      <section class="admin-list-card">
        <h2>Projetos cadastrados</h2>

        <div id="projects-list" class="projects-admin-list">
          <p class="loading-text">Carregando...</p>
        </div>
      </section>
    </main>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-dashboard.js"></script>
  </body>
</html>
